version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      # One PR per theme keeps the review load sane for a solo maintainer.
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier*"
          - "typescript"
          - "@stryker-mutator/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "jsdom"
          - "@axe-core/*"
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
      frontend:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-pwa"
          - "@tanstack/*"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
