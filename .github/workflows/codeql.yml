name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse JavaScript/TypeScript
    runs-on: ubuntu-latest
    # Code scanning is free on public repositories only. On a private repository
    # without GitHub Advanced Security the upload step is rejected, so the job is
    # skipped entirely there - make the repository public and it starts scanning
    # on the next push, without any workflow change.
    if: github.event.repository.private == false
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
